name: Job Profile Auto Updater

on:
  workflow_dispatch:
  schedule:
    - cron: '0,30 1-6 * * *'

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build project
        run: mvn -B clean install

      - name: Run tests
        run: mvn test
